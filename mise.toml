# Local development environment.
#
#   mise install      fetch the toolchain
#   mise run verify   fmt, lint, test, build — the gate before every commit
#   mise run dev      launch the TUI from source
#
# CI pins its own toolchain (dtolnay/rust-toolchain@stable), so this file only
# governs local work. Nothing outside the toolchain is needed: TLS goes through
# rustls, so there is no system OpenSSL or pkg-config to install.

[tools]
rust = { version = "stable", components = "llvm-tools-preview" }
# `mise run coverage`
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"

[tasks.fmt]
description = "Format the workspace"
run = "cargo fmt --all"

[tasks.lint]
description = "Clippy, with warnings denied"
run = "cargo clippy --all-targets -- -D warnings"

[tasks.test]
description = "Run the test suite"
run = "cargo test"

[tasks.build]
description = "Build the debug binary"
run = "cargo build"

[tasks.dev]
description = "Run the TUI from source"
run = "cargo run"

[tasks.coverage]
description = "Line coverage of the unit tests, by file; the use case layer first"
run = [
    "cargo llvm-cov --summary-only 2>/dev/null | grep -E '^(Filename|usecase/)'",
    "cargo llvm-cov report --summary-only | grep -E '^(Filename|TOTAL)'",
]

[tasks."coverage:html"]
description = "Line coverage as a browsable report in target/llvm-cov/html"
run = "cargo llvm-cov --html"

[tasks.verify]
description = "Format, lint, test, and build, in that order"
run = [
    "cargo fmt --all",
    "cargo clippy --all-targets -- -D warnings",
    "cargo test",
    "cargo build",
]
