# tmux for demo/agents.tape: two bare panes, nothing of your own tmux setup.
set -g status off
set -g mouse off
set -g escape-time 0
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour111
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -g default-command "bash --norc --noprofile"
